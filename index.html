<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debt Freedom Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      
      /* Colors */
      --primary: #3b82f6;          /* Bright Blue for Checked Days */
      --tile-unchecked: #334155;   /* Slate Gray for Unchecked Active Days */
      --disabled-bg: #161e2e;     /* Dark Slate for Weekends/Past Days */
      --disabled-text: #475569;
      --accent: #f97316;          /* Orange for Streak */
      --border-color: #334155;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      margin: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .header {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section { margin-bottom: 1.25rem; }

    .label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    /* Input & Apply Button Controls */
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .input-container {
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      flex: 1;
    }

    .input-container input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }

    .input-container span {
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .apply-btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 1rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .apply-btn:hover {
      background-color: #2563eb;
    }

    .apply-btn:active {
      transform: scale(0.96);
    }

    .value-large {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .progress-container { margin: 0.75rem 0 1.25rem 0; }

    .progress-bar-bg {
      background-color: var(--border-color);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .progress-bar-fill {
      background-color: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      text-align: right;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .milestone-box {
      background-color: rgba(59, 130, 246, 0.1);
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }

    .calendar-container {
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .calendar-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .nav-btn {
      background-color: var(--tile-unchecked);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--primary);
      border-color: #60a5fa;
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 700;
      text-align: center;
      padding-bottom: 4px;
    }

    .day-tile {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .check-mark {
      font-size: 0.65rem;
      margin-top: 2px;
      font-weight: 900;
      display: none;
    }

    .day-tile.unchecked {
      background-color: var(--tile-unchecked);
      color: #cbd5e1;
      border: 1px solid #475569;
    }

    .day-tile.checked {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
      border: 1px solid #60a5fa;
    }

    .day-tile.checked .check-mark {
      display: block;
    }

    .day-tile.disabled {
      background-color: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
      border: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      margin-top: 1.25rem;
    }

    .streak { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">🏠 Debt Freedom</div>

    <!-- Monthly Net Earnings Field + Apply Button -->
    <div class="section" style="margin-bottom: 0.75rem;">
      <div class="label">Monthly Net Earnings</div>
      <div class="input-group">
        <div class="input-container">
          <input type="text" id="monthly-salary-input" value="76,000,000" placeholder="0" />
          <span>VND</span>
        </div>
        <button class="apply-btn" id="apply-salary-btn">Apply</button>
      </div>
    </div>

    <div class="section">
      <div class="label">Remaining Debt</div>
      <div class="value-large" id="remaining-debt">300,000,000 VND</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-percent">0%</div>
    </div>

    <!-- Next Milestone UI -->
    <div class="milestone-box">
      <div class="label">Next Milestone</div>
      <div style="font-weight: 700; font-size: 1.05rem;" id="next-milestone">⬇ 200,000,000 VND</div>
      <div style="font-size: 0.85rem; color: var(--text-sub); margin-top: 2px;" id="milestone-date">Target: -</div>
      <div style="font-size: 0.85rem; color: #60a5fa; font-weight: 600; margin-top: 2px;" id="workdays-left">0 workdays left</div>
    </div>

    <!-- Calendar UI -->
    <div class="section">
      <div class="label">Workday Tracker</div>
      <div class="calendar-container">
        <div class="calendar-header">
          <button class="nav-btn" id="prev-month">&lt;</button>
          <div>
            <div class="calendar-title" id="calendar-title">July 2026</div>
            <div style="font-size: 0.7rem; color: var(--text-sub); text-align: center;" id="month-rate-subtitle">0 VND/day</div>
          </div>
          <button class="nav-btn" id="next-month">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div>
        <div class="label">Total Earned</div>
        <div style="font-weight: 700; font-size: 1.1rem;" id="total-earned">0.00M</div>
      </div>
      <div>
        <div class="label">Current Streak</div>
        <div class="streak" id="streak-count">🔥 0 workdays</div>
      </div>
    </div>

    <div class="section" style="margin-top: 1rem; margin-bottom: 0;">
      <div class="label">Projected Debt-Free Date & Days Left</div>
      <div style="font-weight: 700;" id="projected-date">-</div>
      <div style="font-size: 0.85rem; color: var(--text-sub); margin-top: 2px;" id="total-workdays-left">0 total workdays remaining</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
