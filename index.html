<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debt Freedom Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --accent: #f97316;
      --border-color: #334155;
      --disabled-bg: rgba(255, 255, 255, 0.03);
      --disabled-text: #475569;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      margin: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .header {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section { margin-bottom: 1.25rem; }

    .label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    .value-large {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .progress-container { margin: 0.75rem 0 1.25rem 0; }

    .progress-bar-bg {
      background-color: var(--border-color);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .progress-bar-fill {
      background-color: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      text-align: right;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .milestone-box {
      background-color: rgba(59, 130, 246, 0.1);
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }

    .calendar-container {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
    }

    .calendar-title {
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 700;
      text-align: center;
      padding-bottom: 4px;
    }

    .day-tile {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .check-mark {
      font-size: 0.65rem;
      margin-top: 2px;
      opacity: 0;
    }

    /* Active Checked State */
    .day-tile.checked {
      background-color: var(--primary);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    .day-tile.checked .check-mark {
      opacity: 1;
    }

    .day-tile.disabled {
      background-color: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
      border: 1px solid transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      margin-top: 1.25rem;
    }

    .streak { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">🏠 Debt Freedom</div>

    <div class="section">
      <div class="label">Remaining Debt</div>
      <div class="value-large" id="remaining-debt">300,000,000 VND</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-percent">0%</div>
    </div>

    <div class="milestone-box">
      <div class="label">Next Milestone</div>
      <div style="font-weight: 700;" id="next-milestone">⬇ 200,000,000 VND</div>
      <div style="font-size: 0.85rem; color: var(--text-sub);" id="workdays-left">0 workdays left</div>
    </div>

    <!-- Calendar UI -->
    <div class="section">
      <div class="label">Workday Tracker</div>
      <div class="calendar-container">
        <div class="calendar-title">July 2026</div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div>
        <div class="label">Total Earned</div>
        <div style="font-weight: 700; font-size: 1.1rem;" id="total-earned">0.00M</div>
      </div>
      <div>
        <div class="label">Current Streak</div>
        <div class="streak" id="streak-count">🔥 0 workdays</div>
      </div>
    </div>

    <div class="section" style="margin-top: 1rem; margin-bottom: 0;">
      <div class="label">Projected Debt-Free</div>
      <div style="font-weight: 700;" id="projected-date">-</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
